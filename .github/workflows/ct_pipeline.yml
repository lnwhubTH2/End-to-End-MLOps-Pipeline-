name: Continuous Training (CT) Pipeline

# 1. กำหนดเหตุการณ์ที่จะปลุกหุ่นยนต์สาย Data
on:
  push:
    paths:
      - 'data/*.csv'

permissions:
  contents: write

jobs:
  # 2. นิยามงานเทรนและวัดผล
  train-and-evaluate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        run: python train.py

      - name: Evaluate Model Performance
        run: python evaluate.py

      - name: Commit and Push New Champion Model
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add model/champion_model.pkl
          # เช็คว่าไฟล์โมเดลมีการเซฟทับตัวใหม่มาจริงไหม ถ้ามีให้ Commit & Push
          git diff-index --quiet HEAD || git commit -m "🤖 MLOps Bot: Promoted new Challenger as Champion!"
          git pull --rebase origin main
          git push origin HEAD:main